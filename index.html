    <script>
      // Gracefully suppress harmless dev-server HMR WebSocket disconnects in iframe previews
      (function () {
        function isViteWsError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : err.message || '') + '';
          return (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('vite:ws:disconnect') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function (e) {
          if (isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          if (isViteWsError(e.error) || isViteWsError(e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
      })();
    </script>
